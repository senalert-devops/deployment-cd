
name: CD - Déploiement Kubernetes

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [backend-updated, frontend-updated]
  workflow_dispatch:

concurrency:
  group: deploy-senalert
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        shell: pwsh

    env:
      NS: senalert
      DOCKERHUB_USER: ${{ vars.DOCKERHUB_USER }}

    steps:
      # 1. Récupération des manifestes
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Vérification de l'accès au cluster
      - name: Vérifier l'accès au cluster
        run: |
          kubectl cluster-info
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          kubectl get nodes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 3. Remplacement du compte Docker Hub
      - name: Renseigner le compte Docker Hub dans les manifestes
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DOCKERHUB_USER)) {
            throw "La variable DOCKERHUB_USER est vide."
          }

          Get-ChildItem -Path k8s -Filter *.yaml -File | ForEach-Object {
            $content = Get-Content -Path $_.FullName -Raw
            $content = $content.Replace('DOCKERHUB_USER', $env:DOCKERHUB_USER)
            Set-Content -Path $_.FullName -Value $content -NoNewline
          }

      # 4. Création du namespace
      - name: Créer le namespace
        run: |
          kubectl apply -f k8s/namespace.yaml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 5. Création ou mise à jour du Secret Kubernetes
      - name: Créer ou mettre à jour le Secret Kubernetes
        env:
          PG_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:PG_PASSWORD) -or
              [string]::IsNullOrEmpty($env:ADMIN_PASSWORD)) {
            throw "Un ou plusieurs secrets GitHub sont manquants."
          }

          $secretArgs = @(
            'create', 'secret', 'generic', 'senalert-secret',
            '-n', $env:NS,
            '--from-literal=POSTGRES_USER=admin',
            "--from-literal=POSTGRES_PASSWORD=$env:PG_PASSWORD",
            "--from-literal=DATABASE_URL=postgresql://admin:$env:PG_PASSWORD@db-service:5432/senalert",
            "--from-literal=ADMIN_PASSWORD=$env:ADMIN_PASSWORD",
            '--dry-run=client',
            '-o', 'yaml'
          )

          $secretYaml = & kubectl @secretArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $secretYaml | & kubectl apply -f -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 6. Application des manifestes
      - name: Appliquer les manifestes
        run: |
          kubectl apply -f k8s/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 7. Rolling update
      - name: Redéployer
        env:
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          switch ($env:EVENT_ACTION) {
            'backend-updated' {
              kubectl rollout restart deployment/backend -n $env:NS
            }
            'frontend-updated' {
              kubectl rollout restart deployment/frontend -n $env:NS
            }
            default {
               kubectl rollout restart deployment/backend deployment/frontend -n $env:NS
            }
          }

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 8. Attente de la fin du rolling update
      - name: Attendre la fin du rolling update
        run: |
          kubectl rollout status deployment/postgres -n $env:NS --timeout=180s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          kubectl rollout status deployment/backend -n $env:NS --timeout=180s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          kubectl rollout status deployment/frontend -n $env:NS --timeout=180s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 9. Vérification post-déploiement
      - name: Vérifier que l'application répond
        run: |
          kubectl get pods -n $env:NS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Output "Backend :"
          kubectl exec -n $env:NS deploy/backend -- python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/api/health').read().decode())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Output "Frontend vers backend (via nginx) :"
          kubectl exec -n $env:NS deploy/frontend -- wget -qO- http://127.0.0.1/api/health
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 10. Notification : résumé dans l'onglet du run
      - name: Notification
        if: always()
        run: |
          $summary = @(
            "### Déploiement SenAlert : ${{ job.status }}"
            "- Déclencheur : ${{ github.event_name }} ${{ github.event.action }}"
            "- Commit : ${{ github.sha }}"
          )

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
